name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=55

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

      - name: Check syntax
        run: |
          python -c "
          import ast, pathlib
          errors = []
          for f in pathlib.Path('src').rglob('*.py'):
              try: ast.parse(f.read_text())
              except SyntaxError as e: errors.append(f'{f}: {e}')
          if errors:
              for e in errors: print(e)
              exit(1)
          print(f'All {len(list(pathlib.Path(\"src\").rglob(\"*.py\")))} files OK')
          "

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t drone-geo-analysis .

      - name: Verify container starts
        run: |
          docker run -d --name test-container \
            -e LLM_PROVIDER=docker \
            -e SECRET_KEY=test-ci-key \
            -p 5000:5000 \
            drone-geo-analysis
          sleep 10
          docker logs test-container
          curl -f http://localhost:5000/ || (docker logs test-container && exit 1)
          docker stop test-container
