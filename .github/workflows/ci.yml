name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=55

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

      - name: Check syntax
        run: |
          python -c "
          import ast, pathlib
          errors = []
          for f in pathlib.Path('src').rglob('*.py'):
              try: ast.parse(f.read_text())
              except SyntaxError as e: errors.append(f'{f}: {e}')
          if errors:
              for e in errors: print(e)
              exit(1)
          print(f'All {len(list(pathlib.Path(\"src\").rglob(\"*.py\")))} files OK')
          "

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t drone-geo-analysis .

      - name: Verify container starts
        run: |
          docker run -d --name test-container \
            -e LLM_PROVIDER=docker \
            -e SECRET_KEY=test-ci-key \
            -p 5000:5000 \
            drone-geo-analysis
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/ > /dev/null; then
              echo "Server responded after $i attempt(s)"
              ok=1
              break
            fi
            sleep 2
          done
          if [ "${ok:-0}" != "1" ]; then
            docker logs test-container
            exit 1
          fi
          docker stop test-container
