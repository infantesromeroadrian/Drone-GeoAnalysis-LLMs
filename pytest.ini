[pytest]
# Optimised pytest configuration — incremental coverage gate (ADR-001)
addopts = -v --showlocals --tb=short --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=55

# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Log output configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

[coverage:run]
source = src
omit =
    src/templates/*
    src/static/*

[coverage:report]
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING: