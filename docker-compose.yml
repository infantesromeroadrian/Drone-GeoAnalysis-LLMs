services:
  drone-geo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drone-geo-analysis
    volumes:
      - ./missions:/app/missions
      - ./results:/app/results
      - ./logs:/app/logs
      - ./cartography:/app/cartography
      - ./data:/app/data
    env_file:
      - .env
    ports:
      - "4001:5000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 512M
    command: python src/main.py
